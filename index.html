label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}

table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:600}.w{overflow-x:auto}

a.wa{display:block;text-align:center;text-decoration:none;background:#25d366;color:#fff;font-weight:700;border-radius:12px;padding:12px;margin-top:8px}
.empty{text-align:center;color:var(--mut);padding:18px 0}
</style></head><body>

<script>
var $=function(i){return document.getElementById(i)},S={cs:[],es:[],ex:[],prof:{farm:'',owner:'',pin:''},rate:60,prod:12},T='h',M=new Date().toISOString().slice(0,7),armed=null,E={},Q='';
try{var r=localStorage.getItem('dudhpro');if(!r)r=localStorage.getItem('dudh1');if(r){var o=JSON.parse(r);S.cs=(o.cs||o.customers||[]).map(function(c){return{id:c.id,name:c.name,rate:c.rate||0,daily:c.daily||0}});S.es=(o.es||(o.entries||[]).map(function(e){return{id:e.id,d:e.date,c:e.cid,q:e.qty,r:e.rate,p:e.paid}}));S.rate=o.rate||o.defRate||60;S.prod=o.prod||12;S.ex=o.ex||[];S.prof=o.prof||{farm:'',owner:'',pin:''};S.cs.forEach(function(c,i){c.phone=(o.cs||o.customers)[i].phone||''})}}catch(e){}
function sv(){try{localStorage.setItem('dudhpro',JSON.stringify(S))}catch(e){}sync()}
function td(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

function col(n){var h=0;for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%360;return 'hsl('+h+',52%,42%)'}

function cl(){$('ov').style.display='none'}function op(h){$('sh').innerHTML=h;$('ov').style.display='flex'}
// ---------- entry sheet
function openE(c,pay){E={c:c||(S.cs[0]&&S.cs[0].id)||'',d:td(),q:pay?0:1,p:0,pay:!!pay};E.r=E.c?rf(E.c):S.rate;if(!S.cs.length){op('<div class="hd"><b>আগে গ্রাহক যোগ করুন</b><button onclick="cl()">✕</button></div><div class="empty">নিচে "গ্রাহক" ট্যাবে গিয়ে প্রথম গ্রাহকের নাম যোগ করুন</div>');return}ent()}
function ent(){op('<div class="hd"><b>'+(E.id?'এন্ট্রি সম্পাদনা':E.pay?'টাকা নিলাম':'নতুন বিক্রি')+'</b><button onclick="cl()">✕</button></div><div class="sc">'+S.cs.map(function(c){return '<button class="'+(c.id===E.c?'on':'')+'" onclick="E.c=\''+c.id+'\';E.r=rf(E.c);ent()">'+av(c.name)+esc(c.name)+'</button>'}).join('')+'</div><input type="date" value="'+E.d+'" onchange="E.d=this.value">'+(E.pay?'':'<label>পরিমাণ (কেজি)</label><div class="st"><button onclick="sq(-.25)">−</button><input id="eq" type="number" step="0.25" inputmode="decimal" value="'+E.q+'" oninput="E.q=+this.value||0;ut()"><button onclick="sq(.25)">+</button></div><div class="ch">'+[.5,1,1.5,2,3].map(function(q){return '<button class="'+(E.q===q?'on':'')+'" onclick="E.q='+q+';ent()">'+q+'</button>'}).join('')+'</div><label>দাম (৳ প্রতি কেজি)</label><input type="number" inputmode="decimal" value="'+E.r+'" oninput="E.r=+this.value||0;ut()"><div class="tot"><span>মোট দাম</span><span id="et" class="grn">'+tk(E.q*E.r)+'</span></div>')+'<label>কত টাকা দিল</label><div class="row" style="display:flex;gap:8px"><input id="ep" type="number" inputmode="decimal" value="'+(E.p||'')+'" placeholder="0" oninput="E.p=+this.value||0"><button class="ghost" '+(E.pay?'style="display:none"':'')+' onclick="E.p=E.q*E.r;ent()">পুরো</button></div><button class="pb" onclick="svE()">সংরক্ষণ করুন</button>')}
function sq(d){E.q=Math.max(0,Math.round((E.q+d)*100)/100);ent()}function ut(){if($('et'))$('et').textContent=tk(E.q*E.r)}
function svE(){if(!E.q&&!E.p)return;var o={d:E.d,c:E.c,q:E.q,r:E.q?E.r:0,p:E.p},x=E.id&&S.es.find(function(e){return e.id===E.id});if(x)Object.assign(x,o);else{o.id=uid();S.es.push(o)}sv();cl();draw()}
// ---------- customer detail
function det(id){E.det=id;var c=C(id),l=S.es.filter(function(e){return e.c===id&&e.d.slice(0,7)===M}).sort(function(a,b){return a.d<b.d?-1:1}),b=bal(id),s=sum(function(e){return e.c===id&&e.d.slice(0,7)===M}),t=(S.prof.farm?S.prof.farm+'\n':'')+c.name+' — '+M+'\n'+l.map(function(e){return e.d.slice(8)+'/'+e.d.slice(5,7)+': '+(e.o?'পুরাতন বাকি '+tk(e.o):'')+(e.q?e.q+' কেজি = '+tk(e.q*e.r):'')+(e.p?' (জমা '+tk(e.p)+')':'')}).join('\n')+'\nমোট: '+s.k+' কেজি, '+tk(s.a)+'\nমোট বাকি: '+tk(b);
op('<div class="hd"><b>গ্রাহক</b><button onclick="cl()">✕</button></div><label style="margin-top:0">গ্রাহকের নাম (বদলাতে পারবেন)</label><input value="'+esc(c.name)+'" onchange="rn(\''+id+'\',this.value)" style="font-weight:700;font-size:17px;margin-bottom:10px"><div class="card"><div class="k">মোট বাকি</div><div class="v '+(b>0?'red':'grn')+'">'+tk(b)+'</div><div class="k" style="margin-top:6px">'+M+' মাসে: '+s.k+' কেজি · '+tk(s.a)+' · পেয়েছি '+tk(s.p)+'</div></div><div style="display:flex;gap:8px"><button class="pb" style="margin:0" onclick="openE(\''+id+'\')">দুধ লিখুন</button><button class="pb" style="margin:0;background:var(--card);color:var(--pri);border:1px solid var(--pri)" onclick="openE(\''+id+'\',1)">টাকা নিলাম</button></div><button class="ghost" style="width:100%;margin-top:8px" onclick="openO(\''+id+'\')">পুরাতন বাকি লিখুন (আগের হিসাব)</button><label>প্রতিদিনের রুটিন (কেজি, ০ = নেই)</label><input type="number" step="0.25" inputmode="decimal" value="'+(c.daily||'')+'" onchange="C(\''+id+'\').daily=+this.value||0;sv()"><label>এই গ্রাহকের আলাদা দাম (৳)</label><input type="number" inputmode="decimal" value="'+(c.rate||'')+'" placeholder="সাধারণ: '+S.rate+'" onchange="C(\''+id+'\').rate=+this.value||0;sv()"><label>মোবাইল নম্বর (WhatsApp-এর জন্য)</label><input type="tel" inputmode="tel" value="'+esc(c.phone||'')+'" placeholder="01XXXXXXXXX" onchange="C(\''+id+'\').phone=this.value;sv();det(\''+id+'\')"><a class="wa" target="_blank" rel="noopener" href="https://wa.me/'+wp(c.phone)+'?text='+encodeURIComponent(t)+'">WhatsApp-এ হিসাব পাঠান</a><button class="x" style="margin-top:8px" onclick="dc(\''+id+'\')">'+(armed==='c'+id?'নিশ্চিত? সব এন্ট্রিসহ মুছে যাবে':'গ্রাহক মুছুন')+'</button><div class="card" style="margin-top:12px"><h3>'+M+' মাসের খাতা</h3>'+(l.map(function(e){return el(e)}).join('')||'<div class="empty">কোনো এন্ট্রি নেই</div>')+'</div>')}
function routine(){var d=td();S.cs.forEach(function(c){if(c.daily&&!S.es.some(function(e){return e.c===c.id&&e.d===d&&e.auto}))S.es.push({id:uid(),d:d,c:c.id,q:c.daily,r:rf(c.id),p:0,auto:1})});sv();draw()}
// ---------- screens
function home(){var d=td(),t=sum(function(e){return e.d===d}),m=sum(function(e){return e.d.slice(0,7)===d.slice(0,7)}),due=0;S.cs.forEach(function(c){var b=bal(c.id);if(b>0)due+=b});
var pc=Math.min(1,t.k/(S.prod||1)),days=[],lb=[];for(var i=6;i>=0;i--){var x=new Date();x.setDate(x.getDate()-i);var s=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');days.push(sum(function(e){return e.d===s}).k);lb.push(s.slice(8))}
var top=S.cs.map(function(c){return{c:c,b:bal(c.id)}}).filter(function(x){return x.b>0}).sort(function(a,b){return b.b-a.b}).slice(0,4),rt=S.cs.some(function(c){return c.daily&&!S.es.some(function(e){return e.c===c.id&&e.d===d&&e.auto})}),tl=S.es.filter(function(e){return e.d===d});
return '<div class="top"><div><h1>🥛 '+esc(S.prof.farm||'দুধের হিসাব')+'</h1><small>'+(S.prof.owner?esc(S.prof.owner)+' · ':'')+new Date().toLocaleDateString('bn-BD',{weekday:'long',day:'numeric',month:'long'})+'</small></div><span class="k">'+ST+'</span></div><div class="hero"><div class="l"><small>আজকের বিক্রি</small><div class="big">'+t.k+' কেজি</div><div class="mid">দাম '+tk(t.a)+' · পেলাম '+tk(t.p)+'</div></div><div class="ring"><svg viewBox="0 0 100 100" width="92" height="92"><circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="10"/><circle cx="50" cy="50" r="40" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+pc*251+' 251" transform="rotate(-90 50 50)"/></svg><b>'+Math.round(Math.max(0,S.prod-t.k)*10)/10+'<span>লি. বাকি</span></b></div></div>'
+'<div class="g2"><div class="card" style="margin:0"><div class="k">মোট বাকি পাওনা</div><div class="v red">'+tk(due)+'</div></div><div class="card" style="margin:0"><div class="k">এই মাসের আয়</div><div class="v grn">'+tk(m.a)+'</div></div><div class="card" style="margin:0" onclick="T=\'r\';draw()"><div class="k">এই মাসের খরচ</div><div class="v red">'+tk(ex(d.slice(0,7)))+'</div></div><div class="card" style="margin:0"><div class="k">এই মাসের নিট লাভ</div><div class="v '+(m.a-ex(d.slice(0,7))>=0?'grn':'red')+'">'+tk(m.a-ex(d.slice(0,7)))+'</div></div></div>'
+(rt?'<button class="pb ghost" style="background:none;margin:0 0 12px;color:var(--pri)" onclick="routine()">⚡ আজকের রুটিন এক চাপে যোগ করুন</button>':'')
